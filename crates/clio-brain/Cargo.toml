[package]
name = "clio-brain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "clio"
path = "src/main.rs"

[features]
# Embeddings from the local Model2Vec model; without it (or without the model on disk) the
# memory still works, by text only.
default = ["model2vec"]
model2vec = ["clio-memory/model2vec"]

[dependencies]
clio-memory = { path = "../clio-memory" }
clio-contract = { path = "../clio-contract" }
clio-core = { path = "../clio-core" }
clio-gateway = { path = "../clio-gateway" }
clio-node = { path = "../clio-node" }
clio-triage = { path = "../clio-triage" }
clio-vault = { path = "../clio-vault" }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
clio-attacks = { path = "../../testing/attacks" }
clio-canaries = { path = "../../testing/canaries" }
tempfile = "3.27.0"

[lints]
workspace = true
