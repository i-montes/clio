[package]
name = "clio-brain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "clio"
path = "src/main.rs"

[features]
# Vectors from the local models: Granite (through the ONNX Runtime installed on the machine) and
# the static Model2Vec one. Without them (or without a model on disk) the memory works by text.
default = ["model2vec", "granite"]
model2vec = ["clio-memory/model2vec"]
granite = ["clio-memory/granite"]
# The memory engine's tracing spans (off by default, as before).
telemetry = ["clio-memory/telemetry"]

[dependencies]
# clio-memory v0.7.1, pinned by its commit (a tag can move): to move up, put the new tag's commit here.
# Without `cli` (default): that is the setup screen of its binary, nothing the library needs.
clio-memory = { git = "https://github.com/i-montes/clio-memory", rev = "593d50cc0efdd23551ae675d3f53dc95b67a0db9", default-features = false }
clio-contract = { path = "../clio-contract" }
clio-core = { path = "../clio-core" }
clio-gateway = { path = "../clio-gateway" }
clio-node = { path = "../clio-node" }
clio-toolhost = { path = "../clio-toolhost" }
clio-triage = { path = "../clio-triage" }
clio-jev = { path = "../clio-jev" }
clio-vault = { path = "../clio-vault" }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rustix = { version = "1.1.6", default-features = false, features = ["fs", "process", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
signal-hook = { version = "0.3.18", default-features = false }
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
clio-attacks = { path = "../../testing/attacks" }
clio-canaries = { path = "../../testing/canaries" }
tempfile = "3.27.0"
# To put a memory file back to an older schema in a test (same version as clio-memory uses).
rusqlite = { version = "0.41.1", features = ["bundled"] }

[lints]
workspace = true
