[package]
name = "clio-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Not part of the root workspace: cargo-fuzz needs nightly and its own lockfile.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
clio-trace = { path = "../crates/clio-trace" }
clio-bench = { path = "../testing/bench" }
serde_json = "1.0.154"

[[bin]]
name = "traceparent"
path = "fuzz_targets/traceparent.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bench_task"
path = "fuzz_targets/bench_task.rs"
test = false
doc = false
bench = false
