[workspace]
resolver = "3"
members = ["crates/*", "testing/fake-llm", "testing/canaries", "testing/synthetic", "testing/bench", "testing/attacks", "testing/chaos"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

# The password hash is deliberately expensive; unoptimized it makes every test that makes a vault
# take seconds. Only the hash is optimized, so debugging the rest is unchanged.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
