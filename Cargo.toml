[workspace]
resolver = "3"
members = ["crates/*", "testing/fake-llm", "testing/canaries", "testing/synthetic", "testing/bench"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
