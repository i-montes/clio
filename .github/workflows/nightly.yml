name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # 076: the bench with a real model when the OPENCODE_API_KEY secret exists; otherwise the replay
  # bench, so the job never goes green by doing nothing. It blocks when success falls or the cost
  # per task rises past testing/bench/thresholds.json, against baseline-real.json.
  # The tasks are trivial questions with no private data: they go to an outside provider (S-44).
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          flags="--tasks testing/bench/tasks --prices testing/bench/prices.json --provider opencode-go --model beam-free"
          if [ -n "$OPENCODE_API_KEY" ]; then
            cargo run --locked -q -p clio-bench -- real $flags --repeats 3 \
              --baseline testing/bench/baseline-real.json --thresholds testing/bench/thresholds.json \
              --cmd python3 testing/bench/llm_openai_compat.py
          else
            echo "::warning::OPENCODE_API_KEY is not set: running the replay bench only"
            cargo run --locked -q -p clio-bench -- replay $flags --repeats 3 \
              --tape testing/bench/tapes/beam-free.jsonl \
              --baseline testing/bench/baseline.json --thresholds testing/bench/thresholds.json
          fi

  # The chaos harness has no real system to break yet: its tests keep the harness honest.
  chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --locked -p clio-chaos

  # S-48: fuzz each parser for a minute; a crash fails the job.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install --locked cargo-fuzz
      - run: |
          for target in traceparent bench_task; do
            cargo +nightly fuzz run "$target" -- -max_total_time=60
          done

  # A new advisory can appear any day: audit the pinned Pi dependencies every night (S-42).
  pi-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm ci --ignore-scripts && npm audit --audit-level=high
        working-directory: adapters/pi
