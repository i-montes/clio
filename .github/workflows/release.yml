name: release

# 077: before a release, everything the PR checks run, plus the bench, the attacks, the chaos
# run and the human review of the gateway, the vault and the node signatures. The `review` job
# uses the `release-review` environment, whose required reviewer is the owner: the release waits
# there until a person approves it. Before approving, read what changed in the sensitive paths:
#   git diff <last tag>..<this tag> -- crates/clio-gateway crates/clio-vault crates/clio-node apps/pwa
# Never create that environment without a required reviewer: it would approve itself.
#
# Only after every gate and the review: `clio` and `clio-vault` are built for Linux x86_64 and
# aarch64, smoke-tested, attested, and published with `VERSION`, `SHA256SUMS` and `install.sh`
# (what the one-line install and `clio update` read). macOS is not released until it has been run
# end to end (CI still builds and tests it). A manual run builds and tests but publishes nothing;
# only a pushed `v*` tag publishes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  # A tag's version (without its `v`) must be the workspace's, which `clio --version` prints.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag is the version in Cargo.toml, a plain x.y.z
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "clio-brain") | .version')
          # install.sh and `clio update` accept only x.y.z: a pre-release would publish a "latest"
          # neither can install.
          if ! printf '%s\n' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version $v is not x.y.z"
            exit 1
          fi
          if [ "${TAG#v}" != "$v" ]; then
            echo "::error::the tag is $TAG but Cargo.toml says version $v"
            exit 1
          fi
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: scripts/rule-coverage.sh
      - run: sh -n install.sh
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: >
          cargo run --locked -q -p clio-bench -- replay
          --tasks testing/bench/tasks --tape testing/bench/tapes/beam-free.jsonl
          --provider opencode-go --model beam-free
          --prices testing/bench/prices.json --repeats 3
          --baseline testing/bench/baseline.json --thresholds testing/bench/thresholds.json
  attacks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --locked -p clio-attacks
  chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --locked -p clio-chaos
  review:
    runs-on: ubuntu-latest
    environment: release-review
    steps:
      - run: echo "A person approved this release after reading the changes to the gateway, the vault, the node signatures and the PWA."

  build:
    needs: [version, checks, bench, attacks, chaos, review]
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add "${{ matrix.target }}"
      # Linux binaries are linked against glibc 2.28 (the `.2.28` suffix), older than Ubuntu
      # 22.04's 2.35 and Debian 12's 2.36. Not musl: clio-memory loads ONNX Runtime, a glibc
      # library, at run time.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-zigbuild
      - name: Build (Linux, glibc 2.28)
        run: cargo zigbuild --release --locked -p clio-brain --bin clio -p clio-vault --bin clio-vault --target "${{ matrix.target }}.2.28"
      - name: Name the binaries as their assets
        run: |
          mkdir dist
          for b in clio clio-vault; do
            cp "target/${{ matrix.target }}/release/$b" "dist/$b-${{ matrix.target }}"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clio-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # Each binary runs on its own architecture: `--version` is the release's; it needs no glibc newer
  # than 2.28 and starts in Ubuntu 22.04 and Debian 12; install.sh installs it from a release folder.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clio-${{ matrix.target }}
          path: dist
      - name: --version is the release's
        run: |
          chmod +x dist/*
          want="clio $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "clio-brain") | .version')"
          got=$("dist/clio-${{ matrix.target }}" --version)
          echo "$got"
          [ "$got" = "$want" ] || { echo "::error::expected '$want'"; exit 1; }
      - name: It needs glibc 2.28 or older, and starts on Ubuntu 22.04 and Debian 12
        run: |
          for b in clio clio-vault; do
            f="dist/$b-${{ matrix.target }}"
            max=$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
            echo "$b: highest glibc symbol ${max:-none}"
            [ -n "$max" ] || { echo "::error::$b has no GLIBC_ symbols: is it a glibc binary?"; exit 1; }
            top=$(printf '%s\nGLIBC_2.28\n' "$max" | sort -V | tail -1)
            [ "$top" = GLIBC_2.28 ] || { echo "::error::$b needs $max, more than GLIBC_2.28"; exit 1; }
          done
          for image in ubuntu:22.04 debian:12; do
            docker run --rm --network none -v "$PWD/dist:/dist:ro" "$image" "/dist/clio-${{ matrix.target }}" --version
            docker run --rm --network none -v "$PWD/dist:/dist:ro" "$image" "/dist/clio-${{ matrix.target }}" setup --help
            # With no arguments clio-vault answers with its own error: it loaded and ran.
            out=$(docker run --rm --network none -v "$PWD/dist:/dist:ro" "$image" "/dist/clio-vault-${{ matrix.target }}" 2>&1 || true)
            case "$out" in clio-vault:*) ;; *) echo "::error::clio-vault on $image: $out"; exit 1 ;; esac
          done
      - name: install.sh installs them from a release folder
        run: |
          cd dist
          cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "clio-brain") | .version' > VERSION
          sha256sum clio-* > SHA256SUMS
          cd ..
          CLIO_RELEASE_BASE="$PWD/dist" sh install.sh </dev/null
          "$HOME/.local/bin/clio" --version

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, checks, bench, attacks, chaos, review, build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: clio-*
          path: dist
          merge-multiple: true
      # VERSION names the latest release for install.sh and `clio update`; install.sh is the one
      # of this same commit.
      - name: VERSION, install.sh and SHA256SUMS
        working-directory: dist
        run: |
          printf '%s\n' "${TAG#v}" > VERSION
          cp ../install.sh install.sh
          sha256sum clio-* install.sh VERSION > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/clio-*
      - name: Publish the release
        working-directory: dist
        run: gh release create "$TAG" clio-* install.sh VERSION SHA256SUMS --title "$TAG" --generate-notes --verify-tag
