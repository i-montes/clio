name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The jail tests need bubblewrap and unprivileged user namespaces. On the Ubuntu runner install
      # it and lift Ubuntu's restriction (the runner is throwaway), then probe. If it works the jail
      # tests become mandatory (CLIO_REQUIRE_JAIL); if not, say so loudly instead of skipping quietly.
      - name: Jail (bubblewrap) probe
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          if bwrap --unshare-all --ro-bind / / true 2>/dev/null && command -v prlimit >/dev/null; then
            echo "::notice::bwrap works on this runner: the jail tests run for real and are mandatory"
            echo "CLIO_REQUIRE_JAIL=1" >> "$GITHUB_ENV"
          else
            echo "::warning::bwrap or user namespaces are NOT available on this runner: the jail tests are skipped, not verified here"
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      # Acceptance 25: recall over 50k memories in under 150 ms; ignored in the normal run because it builds a big file
      - run: cargo test --locked --release -p clio-memory --test recall t25 -- --ignored --nocapture
        if: matrix.os == 'ubuntu-latest'

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-audit
      - run: cargo audit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rule-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: scripts/rule-coverage.sh

  unsafe-forbid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # S-41: the workspace forbids unsafe and every crate must inherit that lint.
      - run: |
          grep -q '^unsafe_code = "forbid"' Cargo.toml
          for f in crates/*/Cargo.toml testing/*/Cargo.toml; do
            grep -A1 '^\[lints\]' "$f" | grep -q '^workspace = true' || { echo "$f does not inherit workspace lints"; exit 1; }
          done
          ! grep -rnE 'allow\(unsafe_code\)|unsafe (fn|impl|\{)' --include=*.rs crates testing

  # 075: unit, acceptance and attack tests run above (cargo test --workspace); this is the
  # bench in replay mode, which blocks when success or cost get worse than the baseline allows.
  bench-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: >
          cargo run --locked -q -p clio-bench -- replay
          --tasks testing/bench/tasks --tape testing/bench/tapes/beam-free.jsonl
          --provider opencode-go --model beam-free
          --prices testing/bench/prices.json --repeats 3
          --baseline testing/bench/baseline.json --thresholds testing/bench/thresholds.json

  gate-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: scripts/check-gate.sh
      # The checks of the real bench tasks must fail on bad answers and pass on the good one.
      - run: python3 testing/bench/verify_real_tasks.py
      # S-09: versioned system prompts, with a manifest and nothing in them that would matter if it leaked.
      - run: python3 scripts/check-prompts.py --self-test && python3 scripts/check-prompts.py

  # S-42: Pi is installed only from the lockfile and without install scripts; if package.json and
  # the lockfile disagree, or the lockfile would change, this fails and the change gets reviewed.
  pi-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm ci --ignore-scripts
        working-directory: adapters/pi
      - run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json
        working-directory: adapters/pi
      - run: npm audit --audit-level=high
        working-directory: adapters/pi
      - run: npm run check
        working-directory: adapters/pi
