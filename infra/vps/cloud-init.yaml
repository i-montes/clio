#cloud-config
# DRAFT, NOT TESTED: nothing here has run on a real server yet (see infra/vps/README.md).
# Provider-neutral first boot for the VPS that runs the brain (S-38, S-39). The two placeholders
# are filled in by whoever provisions the machine and are NEVER committed:
#   __ADMIN_SSH_PUBLIC_KEY__  a public key (not secret) for the admin user
#   __TAILSCALE_AUTHKEY__     a one-use, short-lived, pre-approved Tailscale key
package_update: true
package_upgrade: true
packages:
  - ufw
  - unattended-upgrades
  - apt-listchanges
  - ca-certificates
  - curl
  - gnupg

users:
  - name: admin
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL   # decision: SSH only reaches this user through Tailscale
    lock_passwd: true
    ssh_authorized_keys:
      - __ADMIN_SSH_PUBLIC_KEY__
  # One system user per component (S-39): none can log in, none can read another's files.
  - {name: clio-agent,  system: true, shell: /usr/sbin/nologin, lock_passwd: true}
  - {name: clio-vault,  system: true, shell: /usr/sbin/nologin, lock_passwd: true}
  - {name: clio-memory, system: true, shell: /usr/sbin/nologin, lock_passwd: true}
  - {name: clio-trace,  system: true, shell: /usr/sbin/nologin, lock_passwd: true}

write_files:
  - path: /etc/ssh/sshd_config.d/99-clio.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      X11Forwarding no
      AllowUsers admin
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/apt/apt.conf.d/52clio-unattended
    permissions: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";

runcmd:
  # Tailscale from its signed apt repository, not a script piped into a shell.
  - install -d -m 0755 /usr/share/keyrings
  - curl -fsSL "https://pkgs.tailscale.com/stable/ubuntu/$(. /etc/os-release && echo $VERSION_CODENAME).noarmor.gpg" -o /usr/share/keyrings/tailscale-archive-keyring.gpg
  - curl -fsSL "https://pkgs.tailscale.com/stable/ubuntu/$(. /etc/os-release && echo $VERSION_CODENAME).tailscale-keyring.list" -o /etc/apt/sources.list.d/tailscale.list
  - apt-get update && apt-get install -y tailscale
  - tailscale up --authkey=__TAILSCALE_AUTHKEY__ --hostname=clio-brain --ssh=false
  # Nothing is reachable from the public internet: only what arrives through the tailnet.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow in on tailscale0
  - ufw --force enable
  - systemctl restart ssh
